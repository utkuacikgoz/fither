<!doctype html><html><head><meta charset="utf-8"><title>C3</title><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="_rows.css">
<style>
/* B — ONE PROMISE, THEN THE PLAN. A short empowering headline instead of
   "Your session is ready", the three facts folded into one quiet line,
   and the plan as figure rows with no tile and no second section label.
   Keeps the list she can check, loses the chrome around it. */
.top { margin-top: 40px; }
.head { font-size: 40px; line-height: 1.06; font-weight: 700; letter-spacing: -1px; max-width: 290px; }
.head em { font-style: normal; color: var(--accent); }
.sub { margin-top: 16px; color: var(--ink-soft); font-size: 16px; line-height: 1.5; }
.plan { margin-top: 34px; }
.blk { display: flex; align-items: center; gap: 16px; padding: 13px 0; border-bottom: 1px solid var(--line); }
.blk:last-child { border-bottom: 0; }
.blk .fig { width: 54px; height: 54px; background: var(--ink); -webkit-mask: var(--m) center/contain no-repeat; mask: var(--m) center/contain no-repeat; flex: 0 0 54px; opacity: .9; }
.blk .n { font-size: 18px; font-weight: 600; }
.blk .p { color: var(--ink-soft); font-size: 14px; margin-top: 3px; }
.bottom { padding-bottom: 8px; gap: 6px; }
/* C3 — SIZED TO ITS WORDS. Not a full-width slab: a compact pill that
   reads as one confident tap, centred, with real air around it. */
.bottom { padding-bottom: 6px; gap: 2px; align-items: center; }
.bottom .btn-primary { padding: 0 44px; min-height: 62px; }
.bottom .btn-quiet { min-height: 48px; }
</style></head><body><div class="phone">
<div class="statusbar"><span>9:41</span><span class="right"><span>●●●●</span><span>⌒</span><span class="batt"></span></span></div>
<div class="screen">
  <div class="rail"><span class="chevron"></span></div>
  <div class="top">
    <div class="head">Ten minutes.<br><em>All yours.</em></div>
    <div class="sub">Four movements, around your elbows, knees and core. Just you and the floor.</div>
  </div>
  <div class="plan">
    <div class="blk"><span class="fig" style="--m:url('../../../app/assets/movements/wall-push-up.png')"></span><div><div class="n">Wall Slide</div><div class="p">3 × 10 reps</div></div></div>
    <div class="blk"><span class="fig" style="--m:url('../../../app/assets/movements/prone-w-raise.png')"></span><div><div class="n">Prone W Raise</div><div class="p">1 × 10 reps</div></div></div>
    <div class="blk"><span class="fig" style="--m:url('../../../app/assets/movements/air-squat.png')"></span><div><div class="n">Air Squat</div><div class="p">2 × 10 reps</div></div></div>
    <div class="blk"><span class="fig" style="--m:url('../../../app/assets/movements/glute-bridge-hold.png')"></span><div><div class="n">Glute Bridge</div><div class="p">2 × 20-second hold</div></div></div>
  </div>
  <div style="flex:1"></div>
  <div class="bottom">
    <div class="btn btn-primary">Start session</div>
    <div class="btn btn-quiet">Change today’s answers</div>
  </div>
</div></div></body></html>
