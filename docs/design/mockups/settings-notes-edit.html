<!doctype html><html><head><meta charset="utf-8"><title>edit Your notes</title><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="_rows.css">
<style>
.rail { padding-top: 8px; }
.t { margin-top: 28px; margin-bottom: 8px; }
.sub { margin-bottom: 24px; max-width: 340px; }
.group { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 0 18px; }
.orow { display: flex; align-items: center; justify-content: space-between; height: 58px; font-size: 17px; }
.orow + .orow { border-top: 1px solid var(--line); }
.orow .ck { color: var(--accent); font-weight: 700; }
.orow .val { color: var(--ink-soft); font-size: 15px; }
.note { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 16px 18px; margin-bottom: 12px; }
.note .d { font-size: 13px; color: var(--ink-soft); margin-bottom: 6px; }
.note .acts { display: flex; gap: 18px; margin-top: 10px; font-size: 15px; color: var(--ink-soft); }
.frow .fig { width: 56px; height: 56px; flex: 0 0 56px; background: var(--ink); -webkit-mask: var(--m) center/contain no-repeat; mask: var(--m) center/contain no-repeat; }
.bottom { padding-bottom: 8px; }

</style></head><body><div class="phone"><div class="statusbar"><span>9:41</span><span class="right"><span>●●●●</span><span>⌒</span><span class="batt"></span></span></div>
<div class="screen">
  <div class="rail"><span class="chevron"></span></div>
  <div class="title t">Your notes</div>
  
  <div class="note"><div class="d">Friday 5 September</div><div style="border:1px solid var(--accent);border-radius:var(--r-card);padding:14px 16px;min-height:110px" class="body">Slept badly, shoulder tight from the desk. Still did the ten minutes.</div><div class="btn btn-primary" style="margin-top:14px;min-height:52px;font-size:18px">Save</div></div>
  <div class="note"><div class="d">Tuesday 2 September</div><div class="body">Kids up at five. Kept it quiet, felt better after.</div><div class="acts"><span>Edit note</span><span>Delete note</span></div></div>
  <div class="caption" style="margin-top:8px">Your notes never leave this phone.</div>
</div>
<div class="home-indicator"></div></div></body></html>
