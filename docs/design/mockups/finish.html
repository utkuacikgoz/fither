<!doctype html><html><head><meta charset="utf-8"><title>Finish</title><link rel="stylesheet" href="tokens.css">
<style>
.center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; }
.figs { display: flex; gap: 8px; margin-bottom: 20px; }
.figs span { width: 72px; height: 72px; background: var(--ink-soft); -webkit-mask: var(--m) center/contain no-repeat; mask: var(--m) center/contain no-repeat; }
.pts { margin-top: 28px; display: flex; flex-direction: column; align-items: center; }
.pts .numeral { color: var(--accent); }
.streak { margin-top: 22px; padding: 10px 18px; border: 1px solid var(--line); border-radius: 999px; font-size: 15px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
.streak i { width: 8px; height: 8px; border-radius: 4px; background: var(--accent); }
.bottom { padding-bottom: 8px; }
</style></head><body><div class="phone">
<div class="statusbar"><span>9:41</span><span class="right"><span>●●●●</span><span>⌒</span><span class="batt"></span></span></div>
<div class="screen">
  <div class="center">
    <div class="figs"><span style="--m:url('../../../app/assets/movements/wall-push-up.png')"></span><span style="--m:url('../../../app/assets/movements/air-squat.png')"></span><span style="--m:url('../../../app/assets/movements/glute-bridge-hold.png')"></span></div>
    <div class="display">Session complete</div>
    <div class="body-soft">That counts.</div>
    <div class="pts"><div class="numeral">+20</div><div class="caption">points</div></div>
    <div class="streak"><i></i>Day 4 in a row.</div>
  </div>
  <div class="bottom"><div class="btn btn-primary">Continue</div></div>
</div>
<div class="home-indicator"></div>
</div></body></html>
