<!doctype html><html><head><meta charset="utf-8"><title>Settings</title><link rel="stylesheet" href="tokens.css">
<style>

.sec { margin-bottom: 28px; }
.sec .caption { margin-bottom: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 16px 20px; }
.stats { display: flex; gap: 12px; }
.stat { flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 16px 18px; }

.prow .name { width: 82px; font-size: 16px; }

.orow { display: flex; align-items: center; justify-content: space-between; height: 56px; font-size: 17px; }
.orow + .orow { border-top: 1px solid var(--line); }

.chips span.sel { background: var(--accent-soft); border-color: var(--accent); }
.scroll { overflow: hidden; flex: 1; }
