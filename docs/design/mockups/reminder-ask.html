<!doctype html><html><head><meta charset="utf-8"><title>Reminder</title><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="_rows.css">
<style>
.h { margin-top: 12px; margin-bottom: 20px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 20px; margin-bottom: 14px; }
.tile .caption { margin-bottom: 14px; }
.prow { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
.prow .name { width: 82px; font-size: 15px; color: var(--ink-soft); font-weight: 500; }
.prow .track { flex: 1; }
.prow .tier { width: 84px; text-align: right; font-size: 13px; color: var(--ink-soft); }
.big { font-size: 34px; font-weight: 700; letter-spacing: -0.6px; line-height: 1.1; }
.sub { color: var(--ink-soft); font-size: 15px; margin-top: 6px; }
.orow { display: flex; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 4px; font-size: 17px; border-top: 1px solid var(--line); }
.orow:first-of-type { border-top: 0; }
.orow .ck { color: var(--accent); font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips span { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); font-size: 15px; font-weight: 500; }
.chips span.sel { background: var(--accent-soft); border-color: var(--accent); }
.scroll { overflow: hidden; flex: 1; }
.foot { text-align: center; color: var(--ink-soft); font-size: 13px; margin: 8px 0 6px; }
</style>
<style>.center { flex:1; display:flex; flex-direction:column; justify-content:center; gap:18px; } .glyph { width: 56px; height: 56px; border-radius: 28px; border: 2px solid var(--accent); position: relative; } .glyph::after { content:""; position:absolute; left: 26px; top: 12px; width: 2px; height: 18px; background: var(--accent); } .glyph::before { content:""; position:absolute; left: 26px; top: 28px; width: 12px; height: 2px; background: var(--accent); }</style></head><body><div class="phone"><div class="statusbar"><span>9:41</span><span class="right"><span>●●●●</span><span>⌒</span><span class="batt"></span></span></div>
<div class="screen">
  <div class="center">
    <div class="glyph"></div>
    <div class="display" style="font-size:38px">A note each day?</div>
    <div class="body-soft" style="max-width:330px">One quiet note a day, an invitation to build today's session. That's all we'd ever send.</div>
  </div>
  <div class="bottom">
    <div class="btn btn-primary">Sounds good</div>
    <div class="btn btn-quiet">Not now</div>
  </div>
</div>
<div class="home-indicator"></div></div></body></html>
