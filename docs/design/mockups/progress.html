<!doctype html><html><head><meta charset="utf-8"><title>Progress</title><link rel="stylesheet" href="tokens.css">
<style>
.h { margin-top: 12px; margin-bottom: 20px; }
.sec { margin-bottom: 28px; }
.sec .caption { margin-bottom: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 16px 20px; }
.stats { display: flex; gap: 12px; }
.stat { flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 16px 18px; }
.stat .numeral { font-size: 44px; line-height: 1; letter-spacing: -1px; }
.stat .numeral.g { color: var(--accent); }
.stat .l { color: var(--ink-soft); font-size: 14px; margin-top: 8px; }
.prow { display: flex; align-items: center; gap: 12px; height: 40px; }
.prow .name { width: 82px; font-size: 16px; }
.prow .track { flex: 1; }
.prow .tier { width: 80px; text-align: right; font-size: 13px; color: var(--ink-soft); }
.orow { display: flex; align-items: center; justify-content: space-between; height: 56px; font-size: 17px; }
.orow + .orow { border-top: 1px solid var(--line); }
.orow .ck { color: var(--accent); font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips span { padding: 9px 14px; border-radius: 999px; border: 1px solid var(--line); font-size: 15px; font-weight: 500; line-height: 1.2; }
.chips span.sel { background: var(--accent-soft); border-color: var(--accent); }
.scroll { overflow: hidden; flex: 1; }
